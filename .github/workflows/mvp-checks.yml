name: MVP checks
on:
  push:
    branches: [main, feature/kharasana-mvp-pilot]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Verify expected application files
        run: test -f index.html && test -f src/cost-engine.mjs && test -f db/001_foundation.sql
