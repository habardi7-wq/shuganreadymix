name: PostgreSQL integration
on:
  push:
    branches: [feature/kharasana-mvp-pilot]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kharasana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kharasana_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: kharasana_ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated auth test stub
        run: psql -v ON_ERROR_STOP=1 -f db/tests/ci-auth-stub.sql
      - name: Apply database migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/002_hardening.sql
          psql -v ON_ERROR_STOP=1 -f db/003_inventory_ledger.sql
      - name: Run inventory transaction integration test
        run: psql -v ON_ERROR_STOP=1 -f db/tests/inventory-smoke.sql
      - name: Test RLS deny-by-default without authenticated identity
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rls-deny-default.sql
      - name: Test two-factory tenant isolation and role enforcement
        run: psql -v ON_ERROR_STOP=1 -f db/tests/tenant-isolation.sql
