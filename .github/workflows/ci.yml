name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/kharasana-pro-platform-hljnpa"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DATABASE_URL: postgresql://user:password@localhost:5432/kharasana_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
